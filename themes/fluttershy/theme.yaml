name: "fluttershy"
author: "Centaur-Vova"
description: "Gentle and caring, with a rainbow mane. For ponies who love kindness."
emoji: "💛"

settings:
  flow:
    default_concurrent: 5
    min_concurrent: 1
    max_concurrent: 7
    task_buttons:
      - { label: "🌸 10 🦄", tasks: 10, stress: false, semaphore_driver: "shared" }
      - { label: "🌸 50 🐴", tasks: 50, stress: false, semaphore_driver: "api" }
      - { label: "🦋 100 🦄", tasks: 100, class: "warning", stress: true, semaphore_driver: "shared" }
      - { label: "🦋 250 🐴", tasks: 250, class: "accent", stress: true, semaphore_driver: "api" }
      - { label: "🎲✨ YAY!", tasks: 0, class: "danger", full_width: true }

  ui:
    # See color-generators.js
    color_generator: "rainbow"
    label_text_color: "#4a3728" # warm brown for contrast on light background
    progress_bar:
      height: 3
      min_scale: 0.9 # Still show on mid scaled shapes
    lod:
      normal_max: 1000
      medium_max: 1500
      scale_normal: 1.8
      scale_medium: 1.3
    # Manual Override: uncomment to use fixed colors instead of the procedural generator
    task_colors:
      1: "#ee6fa1"   # Pink (Fluttershy's mane)
      2: "#f9a8d4"   # Light pink
      3: "#fde047"   # Yellow (her coat)
      4: "#a7f3d0"   # Mint green
      5: "#93c5fd"   # Baby blue
      6: "#c4b5fd"   # Lavender
      7: "#f0abfc"   # Soft purple
