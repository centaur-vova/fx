name: "fluttershy"
author: "Centaur-Vova"
description: "Gentle and caring, with a rainbow mane. For ponies who love kindness."
emoji: "💛"

settings:
  flow:
    default_concurrent: 5
    min_concurrent: 1
    max_concurrent: 7
    task_buttons:
      - { label: "🌸 25 🦄", tasks: 25, stress: false, semaphore_driver: "shared", tooltip: "25 slow tasks, shared memory" }
      - { label: "🌸 25 🐴", tasks: 25, stress: false, semaphore_driver: "api", tooltip: "25 slow tasks, Go API" }
      - { label: "🦋 500 🦄", tasks: 500, class: "warning", stress: true, semaphore_driver: "shared", tooltip: "500 fast tasks, shared memory" }
      - { label: "🦋 500 🐴", tasks: 500, class: "accent", stress: true, semaphore_driver: "api", tooltip: "500 fast tasks, Go API" }
      - { label: "🎲✨ YAY!", mode: "rand", class: "danger", full_width: true, tooltip: "Random pony chaos!" }

  ui:
    # See color-generators.js
    color_generator: "rainbow"
    label_text_color: "#4a3728" # warm brown for contrast on light background
    progress_bar:
      height: 3
      min_scale: 0.9 # Still show on mid scaled shapes
    lod:
      normal_max: 1000
      medium_max: 1500
      scale_normal: 1.8
      scale_medium: 1.3
