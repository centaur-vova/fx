name: "crystal"
author: "Centaur-Vova"
description: "Precision-engineered transparency. Lightweight, clean, efficient."
emoji: "💎"

settings:
  flow:
    default_concurrent: 50
    min_concurrent: 1
    max_concurrent: 100
    task_buttons:
      - { label: "🌀 25 (PHP)", tasks: 25, stress: false, semaphore_driver: "shared" }
      - { label: "🌀 100 (Go API)", tasks: 100, stress: false, semaphore_driver: "api" }
      - { label: "⚡ 250 (PHP)", tasks: 250, class: "warning", stress: true, semaphore_driver: "shared" }
      - { label: "⚡ 500 (Go API)", tasks: 500, class: "accent", stress: true, semaphore_driver: "api" }
      - { label: "🎲 RAND", tasks: 0, class: "danger", full_width: true }

  ui:
    color_generator: "ice"
    progress_bar:
      height: 2
    lod:
      normal_max: 500
      medium_max: 1000
      scale_normal: 1.0
      scale_medium: 0.6
    # Label color — auto-contrast will work, but explicit is better for light theme
    label_text_color: "#0f172a"  # Dark slate for max contrast on light backgrounds
