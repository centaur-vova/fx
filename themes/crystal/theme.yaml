name: "crystal"
author: "Centaur-Vova"
description: "Precision-engineered transparency. Lightweight, clean, efficient."
emoji: "💎"

settings:
  flow:
    default_concurrent: 50
    min_concurrent: 1
    max_concurrent: 100
    task_buttons:
      - { label: "❄️ 25 (PHP)", tasks: 25, stress: false, semaphore_driver: "shared", tooltip: "~1-2s per task, shared memory" }
      - { label: "❄️ 25 (API)", tasks: 25, stress: false, semaphore_driver: "api", tooltip: "~1-2s per task, Go API" }
      - { label: "💎 500 (PHP)", tasks: 500, class: "warning", stress: true, semaphore_driver: "shared", tooltip: "~1ms per task, shared memory" }
      - { label: "💎 500 (API)", tasks: 500, class: "accent", stress: true, semaphore_driver: "api", tooltip: "~1ms per task, Go API" }
      - { label: "🎲 RAND", tasks: 0, class: "danger", full_width: true, tooltip: "Random task count, random semaphores" }

  ui:
    color_generator: "ice"
    progress_bar:
      height: 2
    lod:
      normal_max: 500
      medium_max: 1000
      scale_normal: 1.0
      scale_medium: 0.6
    # Label color — auto-contrast will work, but explicit is better for light theme
    label_text_color: "#0f172a"  # Dark slate for max contrast on light backgrounds
