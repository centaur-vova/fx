name: "sin-city"
author: "Centaur-Vova"
description: "Black, white, and red. No mercy. Critical tasks only."
emoji: "🖤"

settings:
  flow:
    default_concurrent: 127
    min_concurrent: 1
    max_concurrent: 255
    task_buttons:
      - { label: "🥀 Slow 25 [PHP]", tasks: 25, stress: false, semaphore_driver: "shared", tooltip: "~1-2s, shared memory" }
      - { label: "🥀 Slow 25 [API]", tasks: 25, stress: false, semaphore_driver: "api", tooltip: "~1-2s, Go API" }
      - { label: "🔪 Fast 500 [PHP]", tasks: 500, class: "warning", stress: true, semaphore_driver: "shared", tooltip: "~1ms, shared memory" }
      - { label: "🔪 Fast 500 [API]", tasks: 500, class: "accent", stress: true, semaphore_driver: "api", tooltip: "~1ms, Go API" }
      - { label: "💀 RAND", mode: "rand", class: "danger", full_width: true, tooltip: "Random noir chaos" }
  ui:
    color_generator: "noir"
    label_text_color: "#ffffff"

    progress_bar:
      height: 0  # No progress bar in sin-city

    lod:
      normal_max: 700
      medium_max: 1200
      scale_normal: 0.8
      scale_medium: 0.5
