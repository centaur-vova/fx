name: "sin-city"
author: "Centaur-Vova"
description: "Black, white, and red. No mercy. Critical tasks only."
emoji: "🖤"

settings:
  flow:
    default_concurrent: 127
    min_concurrent: 1
    max_concurrent: 255
    task_buttons:
      - { label: "🖤 25 (PHP)", tasks: 25, stress: false, semaphore_driver: "shared" }
      - { label: "🖤 100 (Go API)", tasks: 100, stress: false, semaphore_driver: "api" }
      - { label: "⚡ 500 (PHP)", tasks: 500, class: "warning", stress: true, semaphore_driver: "shared" }
      - { label: "⚡ 1000 (Go API)", tasks: 1000, class: "accent", stress: true, semaphore_driver: "api" }
      - { label: "💀 RAND", tasks: 0, class: "danger", full_width: true }
  ui:
    color_generator: "noir"
    label_text_color: "#ffffff"

    progress_bar:
      height: 0  # No progress bar in sin-city

    lod:
      normal_max: 700
      medium_max: 1200
      scale_normal: 0.8
      scale_medium: 0.5
