name: "borderlands"
author: "Centaur-Vova"
description: "Cel-shaded chaos meets 8-bit nostalgia. Yellow, red, white, black outlines."
emoji: "🎮"

settings:
  flow:
    default_concurrent: 75
    min_concurrent: 1
    max_concurrent: 150
    task_buttons:
      - { label: "👾 25 (PHP)", tasks: 25, stress: false, semaphore_driver: "shared", tooltip: "~1-2s, shared memory" }
      - { label: "👾 100 (API)", tasks: 100, stress: false, semaphore_driver: "api", tooltip: "~1-2s, Go API" }
      - { label: "🎮 250 (PHP)", tasks: 250, class: "warning", stress: true, semaphore_driver: "shared", tooltip: "~1ms, shared memory" }
      - { label: "🎮 500 (API)", tasks: 500, class: "accent", stress: true, semaphore_driver: "api", tooltip: "~1ms, Go API" }
      - { label: "🎲 RAND", mode: "rand", class: "danger", full_width: true, tooltip: "CHAOS!" }

  ui:
    color_generator: "borderlands"
    progress_bar:
      height: 3
    lod:
      normal_max: 750
      medium_max: 1500
      scale_normal: 1.0
      scale_medium: 0.6
    label_text_color: "#000000"  # Black for max contrast on yellow