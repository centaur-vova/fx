name: "fast"
author: "Centaur-Vova"
description: "Neon velocity. High-throughput, low-latency, max performance."
emoji: "🚀"

settings:
  flow:
    default_concurrent: 5
    min_concurrent: 1
    max_concurrent: 10
    task_buttons:
      - { label: "🌀 25 (PHP)", tasks: 25, stress: false, semaphore_driver: "shared" }
      - { label: "🌀 100 (Go API)", tasks: 100, stress: false, semaphore_driver: "api" }
      - { label: "⚡ 250 (PHP)", tasks: 250, class: "warning", stress: true, semaphore_driver: "shared" }
      - { label: "⚡ 500 (Go API)", tasks: 500, class: "accent", stress: true, semaphore_driver: "api" }
      - { label: "🎲 RAND", tasks: 0, class: "danger", full_width: true }

  ui:
    # See color-generators.js
    color_generator: "neon"
    label_text_color: white # classic
    progress_bar:
      height: 4
      min_scale: 0.8 # Still show on mid scaled shapes
    lod:
      normal_max: 500
      medium_max: 1000
      scale_normal: 1.2
      scale_medium: 0.8
    # Manual Override: uncomment to use fixed colors instead of the procedural generator
    #task_colors:
    #  1: "#6366f1" # Indigo
    #  2: "#3b82f6" # Blue
    #  3: "#06b6d4" # Cyan
    #  4: "#10b981" # Emerald
    #  5: "#84cc16" # Lime
    #  6: "#eab308" # Yellow
    #  7: "#f97316" # Orange
    #  8: "#f43f5e" # Rose
    #  9: "#ef4444" # Red
    #  10: "#a855f7" # Purple