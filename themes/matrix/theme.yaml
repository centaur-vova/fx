name: "matrix"
author: "Centaur-Vova"
description: "Digital rain. Green phosphor on black. The code is everywhere."
emoji: "🟢"

settings:
  flow:
    hide_mc_slider: true
    default_concurrent: 100
    min_concurrent: 1
    max_concurrent: 200
    task_buttons:
      - { label: "💊 Синяя или Красная", mode: "rand", class: "danger", full_width: true, tooltip: "Правда освободит. Или сломает" }
      - { label: "🐇 Down the Rabbit Hole", mode: "nitro", class: "danger", full_width: true, tooltip: "Max load. Blue pill stays in the queue" }

  ui:
    color_generator: "matrix"
    progress_bar:
      height: 2
    lod:
      normal_max: 1000
      medium_max: 2000
      scale_normal: 1.0
      scale_medium: 0.6
    label_text_color: "#00ff41"  # Phosphor green for max contrast on dark