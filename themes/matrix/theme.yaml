name: "matrix"
author: "Centaur-Vova"
description: "Digital rain. Green phosphor on black. The code is everywhere."
emoji: "🟢"

settings:
  flow:
    hide_mc_slider: true
    task_buttons:
      - { label: "🔴🔵", mode: "rand", class: "danger", full_width: true, tooltip: "RND" }
      - { label: "🐎💨", mode: "nitro", class: "danger", full_width: true, tooltip: "0xFF | API" }

  ui:
    color_generator: "*matrix-2"
    progress_bar:
      height: 0
    lod:
      normal_max: 250
      medium_max: 1500
      scale_normal: 0.9
      scale_medium: 0.75
    remove_delays:
      lock_failed: 1000
    label_text_color: "#00ff41"  # Phosphor green for max contrast on dark