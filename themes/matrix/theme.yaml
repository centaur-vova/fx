name: "matrix"
author: "Centaur-Vova"
description: "Digital rain. Green phosphor on black. The code is everywhere."
emoji: "🟢"

settings:
  flow:
    default_concurrent: 100
    min_concurrent: 1
    max_concurrent: 200
    task_buttons:
      - { label: "🟢 25 (PHP)", tasks: 25, stress: false, semaphore_driver: "shared" }
      - { label: "🟢 100 (Go API)", tasks: 100, stress: false, semaphore_driver: "api" }
      - { label: "⚡ 250 (PHP)", tasks: 250, class: "warning", stress: true, semaphore_driver: "shared" }
      - { label: "⚡ 500 (Go API)", tasks: 500, class: "accent", stress: true, semaphore_driver: "api" }
      - { label: "🎲 RAND", tasks: 0, class: "danger", full_width: true }

  ui:
    color_generator: "matrix"
    progress_bar:
      height: 2
    lod:
      normal_max: 1000
      medium_max: 2000
      scale_normal: 1.0
      scale_medium: 0.6
    label_text_color: "#00ff41"  # Phosphor green for max contrast on dark