<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FAST.AF · Atomic Flow · KBL v3.0</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="dist/style.min.css" />
    <meta
      name="description"
      content="High‑load task orchestrator with real‑time visualization. PHP 8.4, Swoole, NATS JetStream, Go WebSocket. KBL v3.0 license."
    />
    <meta
      name="keywords"
      content="Swoole, NATS, Go, highload, KBL, semaphores, WebSocket, PHP, demo, horse"
    />
    <meta name="author" content="Centaur-Vova (Dmitry Shmanatov)" />
  </head>

  <body
    x-data
    x-cloak
    class="flex flex-col"
    style="background-color: var(--bg-primary)"
  >
    <div
      class="toast"
      :class="{
        show: $store.app.toast.show,
        success: $store.app.toast.success,
        error: !$store.app.toast.success
      }"
      x-html="$store.app.toast.content"
    ></div>

    <div class="flex-grow-1 overflow-hidden p-3">
      <div class="max-w-7xl mx-auto h-full flex flex-col gap-3">
        <!-- HEADER -->
        <div
          class="rounded-xl shadow-2xl p-4"
          style="
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-default);
          "
        >
          <div class="flex justify-between items-center">
            <!-- LEFT: LOGO (Stay static) -->
            <a
              href="./"
              target="_blank"
              class="block hover:opacity-80 transition-opacity"
            >
              <h1
                class="text-xl font-black tracking-tighter uppercase italic"
                style="color: var(--text-white)"
              >
                Fast.<span style="color: var(--color-success)">AF</span>
              </h1>
              <p
                class="text-[10px] font-mono uppercase tracking-widest"
                style="color: var(--text-muted)"
              >
                High-Load Pipeline Engine
              </p>
            </a>

            <!-- RIGHT: METRICS (Fixed layout) -->
            <div class="flex items-center gap-6">
              <!-- Stats Grid: Use flex with fixed widths to prevent shifting -->
              <div class="flex gap-6 text-right" x-data>
                <!-- Workers Heatmap -->
                <div
                  class="text-xs pr-6"
                  style="border-right: 1px solid var(--border-default)"
                >
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase tracking-tighter text-right"
                    style="color: var(--text-muted)"
                    >Workers</span
                  >
                  <div
                    id="worker-heatmap"
                    class="flex gap-1 justify-end items-center h-[14px]"
                  >
                    <template x-for="(w, i) in $store.app.workers" :key="i">
                      <div
                        class="worker-bar"
                        :class="{ 'flash-success': w.status === 'success', 'flash-error': w.status === 'error' }"
                      ></div>
                    </template>
                  </div>
                </div>

                <!-- Queue -->
                <div class="text-xs">
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase"
                    style="color: var(--text-muted)"
                    >Flow</span
                  >
                  <b
                    class="block font-mono text-sm min-w-[70px]"
                    style="color: var(--color-warning)"
                  >
                    <span x-text="$store.app.metrics.taskNum">--</span>
                  </b>
                </div>

                <!-- Memory -->
                <div class="text-xs">
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase"
                    style="color: var(--text-muted)"
                    >Memory</span
                  >
                  <b
                    x-text="$store.app.metrics.memory"
                    class="block font-mono text-sm min-w-[70px]"
                    style="color: var(--color-info)"
                    >--MB</b
                  >
                </div>

                <!-- Clients -->
                <div class="text-xs">
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase"
                    style="color: var(--text-muted)"
                    >Clients</span
                  >
                  <b
                    x-text="$store.app.metrics.connections"
                    class="block font-mono text-sm min-w-[40px]"
                    style="color: var(--color-subtle)"
                    >--</b
                  >
                </div>

                <!-- CPU -->
                <div class="text-xs">
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase"
                    style="color: var(--text-muted)"
                    >CPU</span
                  >
                  <b
                    x-text="$store.app.metrics.cpu"
                    class="block font-mono text-sm min-w-[60px] text-right"
                    style="color: var(--color-error)"
                    >--%</b
                  >
                </div>

                <!-- Ping (Latency) -->
                <div class="text-xs">
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase"
                    style="color: var(--text-muted)"
                    >Ping</span
                  >
                  <b
                    x-text="$store.app.latency + 'ms'"
                    class="block font-mono text-sm min-w-[55px]"
                    style="color: var(--color-warning)"
                    >--ms</b
                  >
                </div>

                <!-- Cores -->
                <div class="text-xs">
                  <span
                    class="block text-[9px] font-bold mb-1 uppercase"
                    style="color: var(--text-muted)"
                    >Cores</span
                  >
                  <b
                    x-text="$store.app.system.cpu_cores"
                    class="block font-mono text-sm drop-shadow-[0_0_5px_rgba(34,211,238,0.4)] min-w-[30px]"
                    style="color: var(--color-bright)"
                    >--</b
                  >
                </div>
              </div>

              <!-- Reactor Status: Anchored to the far right -->
              <div
                class="pl-6 min-w-[90px]"
                style="border-left: 1px solid var(--border-default)"
              >
                <span
                  class="block text-[9px] font-bold mb-1 uppercase tracking-tighter text-right"
                  style="color: var(--text-muted)"
                  >Reactor</span
                >
                <div
                  class="status-block flex items-center gap-2 justify-end"
                  :class="{ 'is-online': $store.app.isOnline }"
                >
                  <div class="status-dot"></div>
                  <b
                    class="status-text font-mono text-[10px] uppercase"
                    x-text="$store.app.isOnline ? 'Online' : 'Offline'"
                  ></b>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- PIPELINE -->
        <div class="main-section">
          <div class="pipeline-background">
            <div class="zone-bg zone-queue"></div>
            <div class="zone-bg zone-lock"></div>
            <div class="zone-bg zone-work"></div>
            <div class="zone-bg zone-done"></div>
          </div>

          <div id="pipeline" class="relative h-full w-full z-10"></div>

          <!-- Zone labels -->
          <div class="zone-label label-queue">Queue</div>
          <div class="zone-label label-lock">Check Lock</div>
          <div class="zone-label label-work">In Progress</div>
          <div class="zone-label label-done">Complete</div>
        </div>

        <!-- Grid: Controls (4) + Terminal (8) -->
        <div class="grid grid-cols-12 gap-4">
          <!-- LEFT: CONTROL PANEL -->
          <div
            class="col-span-4 rounded-xl overflow-hidden flex flex-col shadow-2xl"
            style="
              background-color: var(--bg-elevated);
              border: 1px solid var(--border-default);
            "
          >
            <!-- Panel header (same style as terminal) -->
            <div
              class="px-3 py-2 flex justify-between gap-2 shrink-0 select-none"
              style="
                background-color: var(--bg-elevated);
                border-bottom: 1px solid var(--border-default);
              "
            >
              <span
                class="font-mono text-[9px] font-black tracking-[0.2em] uppercase"
                style="color: var(--text-muted)"
                >CONTROL.PANEL</span
              >
              <span
                class="text-[8px] font-mono uppercase tracking-widest"
                style="color: var(--text-secondary)"
              >
                <div class="flex flex-col items-end gap-2 pointer-events-auto">
                  <!-- RENDER TOGGLE -->
                  <label
                    class="flex items-center gap-2 cursor-pointer group select-none"
                  >
                    <input
                      type="checkbox"
                      x-model="$store.app.renderEnabled"
                      class="hidden peer"
                    />
                    <div
                      class="w-2 h-2 rounded-full transition-all"
                      style="
                        border: 1px solid var(--text-secondary);
                        box-shadow: 0 0 5px rgba(34, 197, 94, 0.3);
                      "
                    ></div>
                    <span
                      class="text-[8px] font-mono uppercase tracking-tighter"
                      style="color: var(--text-muted)"
                    >
                      Visual Engine:
                      <span
                        :class="$store.app.renderEnabled ? 'text-green-500' : 'text-red-500'"
                        x-text="$store.app.renderEnabled ? 'Active' : 'Paused'"
                      ></span>
                    </span>
                  </label>
                </div>
              </span>
            </div>

            <!-- Panel content -->
            <div class="p-4 flex flex-col gap-4">
              <!-- Concurrency slider -->
              <div class="slider-group w-full">
                <label
                  class="flex justify-between items-center text-[10px] font-mono font-black uppercase mb-2 tracking-widest"
                  style="color: var(--text-muted)"
                >
                  <span>Concurrent Limit</span>
                  <span
                    x-text="$store.app.mc"
                    style="
                      color: var(--color-success);
                      text-shadow: 0 0 5px rgba(34, 197, 94, 0.4);
                    "
                  ></span>
                </label>
                <input
                  type="range"
                  id="max-concurrent-slider"
                  x-model="$store.app.mc"
                  class="block w-full cursor-pointer"
                  min="1"
                  max="10"
                />
              </div>

              <!-- Task injection buttons -->
              <div class="grid grid-cols-2 gap-2 flex-grow">
                <button
                  class="task-button py-2"
                  @click="$store.app.createTasks(1)"
                >
                  1 Task
                </button>
                <button
                  class="task-button py-2"
                  @click="$store.app.createTasks(10)"
                >
                  10 Tasks
                </button>
                <button
                  class="task-button py-2"
                  @click="$store.app.createTasks(50)"
                >
                  50 Tasks
                </button>
                <button
                  class="task-button py-2"
                  @click="$store.app.createTasks(100)"
                >
                  100 Tasks
                </button>
                <button
                  class="task-button task-button-warning py-2"
                  @click="$store.app.createTasks(500)"
                  :disabled="$store.app.system.queue_capacity < 500"
                >
                  500 Tasks
                </button>
                <button
                  class="task-button task-button-accent py-2"
                  @click="$store.app.createTasks(1000)"
                  :disabled="$store.app.system.queue_capacity < 1000"
                >
                  1k Batch
                </button>
              </div>
            </div>
          </div>

          <!-- CENTER: STATS (Nutz) -->
          <div
            class="col-span-4 rounded-xl overflow-hidden flex flex-col shadow-2xl"
            style="
              background-color: var(--bg-elevated);
              border: 1px solid var(--border-default);
            "
          >
            <!-- Stats Header -->
            <div
              class="px-3 py-2 flex justify-between items-center shrink-0 select-none"
              style="
                background-color: var(--bg-elevated);
                border-bottom: 1px solid var(--border-default);
              "
            >
              <span
                class="font-mono text-[9px] font-black tracking-[0.2em] uppercase"
                style="color: var(--text-muted)"
                >DEEZ-NUTZ.STATS</span
              >
              <span
                class="text-[8px] font-mono uppercase tracking-widest"
                style="color: var(--text-secondary)"
              >
                Stream created:
                <span x-text="$store.app.system.stream_created_at ?? ''"></span>
              </span>
            </div>

            <!-- Stats Content -->
            <div class="p-4 flex flex-col h-full gap-2 font-mono text-[10px]">
              <div class="flex justify-between">
                <span style="color: var(--text-muted)">Messages:</span>
                <span
                  style="color: var(--color-success)"
                  x-text="$store.app.metrics.natsStats?.messages ?? 0"
                ></span>
              </div>
              <div class="flex justify-between">
                <span style="color: var(--text-muted)">Size:</span>
                <span
                  style="color: var(--color-success)"
                  x-text="($store.app.metrics.natsStats?.bytes / 1024).toFixed(1) + ' KB'"
                ></span>
              </div>
              <div class="flex justify-center mt-auto">
                <canvas id="msg-chart"></canvas>
              </div>
              <button
                class="task-button task-button-danger w-full mt-2 py-2"
                @click="$store.app.confirmPurge()"
              >
                Clear Queue
              </button>
            </div>
          </div>

          <!-- RIGHT: TERMINAL (Neon Log Mode) -->
          <div
            class="col-span-4 rounded-xl overflow-hidden flex flex-col shadow-2xl min-h-[220px]"
            style="
              background-color: var(--bg-primary);
              border: 1px solid var(--border-default);
            "
          >
            <!-- Terminal Header -->
            <div
              class="px-3 py-2 flex justify-between items-center shrink-0 select-none"
              style="
                background-color: var(--bg-elevated);
                border-bottom: 1px solid var(--border-default);
              "
            >
              <div class="flex items-center gap-2">
                <span
                  class="font-mono text-[9px] font-black tracking-[0.2em] uppercase"
                  style="color: var(--text-muted)"
                  >SYSTEM.TERMINAL_LOG</span
                >
              </div>
              <div
                class="text-[8px] font-mono uppercase tracking-widest"
                style="color: var(--text-secondary)"
              >
                <a
                  href="https://github.com/shmandalf/fast-atomic-flow"
                  target="_blank"
                  class="version-link"
                  ><span
                    id="app-version"
                    x-html="$store.app.system.app_version"
                  ></span
                ></a>
                /
                <span
                  id="build-date"
                  x-html="$store.app.system.build_date"
                ></span>
              </div>
            </div>

            <!-- Log Panel -->
            <div class="relative flex-1">
              <div
                id="log-panel"
                :class="{ 'log-panel-disabled': $store.app.isLogPanelDisabled }"
                class="absolute inset-0 p-3 font-mono text-[9px] overflow-y-auto"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="purge-modal"
      class="fixed inset-0 flex items-center justify-center z-50 hidden"
      style="background-color: var(--bg-overlay)"
    >
      <div
        class="rounded-xl p-6 w-96 shadow-2xl"
        style="
          background-color: var(--bg-elevated);
          border: 1px solid var(--border-default);
        "
      >
        <h3 class="text-lg font-bold mb-2" style="color: var(--text-white)">
          Purge Queue
        </h3>
        <p class="text-sm mb-6" style="color: var(--text-muted)">
          This will remove all tasks from NATS. Are you sure?
        </p>
        <div class="flex justify-end gap-3">
          <button
            id="cancel-purge"
            class="px-4 py-2 rounded transition-colors"
            style="background-color: #374151; color: var(--text-muted)"
          >
            Cancel
          </button>
          <button
            id="confirm-purge"
            class="px-4 py-2 rounded transition-colors"
            style="
              background-color: var(--color-error);
              color: var(--text-white);
            "
          >
            Purge
          </button>
        </div>
      </div>
    </div>

    <script src="dist/app.min.js"></script>
  </body>
</html>
