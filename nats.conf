# Clients' port (4222 by default)
port: $NATS_PORT

# Connection limits and buffers
max_pending: 256MB
max_payload: 1MB
write_deadline: 30s

# Ping/pong for client liveness
ping_interval: 2m
ping_max: 5

jetstream {
    store_dir: "/data"
    max_memory_store: 256M
    max_file_store: 2G
}

authorization {
  token: $NATS_TOKEN
}