services:
  jaeger:
    image: jaegertracing/jaeger:2.17.0
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
    command:
      - "--config"
      - "/etc/jaeger/config.yaml"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP
    networks:
      - atomic-network
    restart: always
  app:
    image: ghcr.io/centaur-vova/fast-atomic-flow:latest
    restart: always
    env_file:
      - .env
    depends_on:
      - deez-nutz
      - ws
    ports:
      - "${SERVER_PORT:-9501}:${SERVER_PORT:-9501}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - atomic-network

  deez-nutz:
    image: nats:2.12.8-alpine
    command: ["-c", "/etc/nats.conf", "-js"]
    restart: always
    volumes:
      - ./nats.conf:/etc/nats.conf:ro
      - deez-nutz-data:/data
    ports:
      - "127.0.0.1:${NATS_PORT}:${NATS_PORT}"
    environment:
      - NATS_TOKEN=${NATS_TOKEN}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - atomic-network

  redis:
    image: redis:8.0-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - atomic-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ws:
    image: ghcr.io/centaur-vova/fast-atomic-flow-ws:latest
    restart: always
    command: /usr/local/bin/go-proxy
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WS_PORT=${WS_PORT}
      - NATS_HOST=${NATS_HOST}
      - NATS_PORT=${NATS_PORT}
      - NATS_TOKEN=${NATS_TOKEN}
      - NATS_STREAM_TASKS=${NATS_STREAM_TASKS}
      - NATS_SUBJECT_BROADCAST=${NATS_SUBJECT_BROADCAST}
      - QUEUE_CAPACITY=${QUEUE_CAPACITY}
      - SERVER_WORKER_NUM=${SERVER_WORKER_NUM}
      - METRICS_UPDATE_INTERVAL_MS=${METRICS_UPDATE_INTERVAL_MS}
    ports:
      - "127.0.0.1:${WS_PORT}:${WS_PORT}"
    volumes:
      - ./go/config:/app/config:ro
    networks:
      - atomic-network
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - deez-nutz

  balancer:
    image: ghcr.io/centaur-vova/fast-atomic-flow-balancer:latest
    restart: always
    command: /usr/local/bin/balancer
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_AUTH_KEY=${API_AUTH_KEY}
      - API_PORT=${API_PORT}
      - BALANCER_API_KEY=${BALANCER_API_KEY}
      - REDIS_URL=${REDIS_URL}
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"
    networks:
      - atomic-network
    depends_on:
      - ws
      - redis

  api:
    image: ghcr.io/centaur-vova/fast-atomic-flow-api:latest
    restart: always
    command: /usr/local/bin/api
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_PORT=8081 # Internal container port for balancer traffic. Uniform across all instances thanks to Docker network isolation.
      - API_URL=${API_URL}
      - API_AUTH_KEY=${API_AUTH_KEY}
      - BALANCER_API_KEY=${BALANCER_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Nats
      - NATS_HOST=${NATS_HOST}
      - NATS_PORT=${NATS_PORT}
      - NATS_TOKEN=${NATS_TOKEN}
      - NATS_SUBJECT_BROADCAST=${NATS_SUBJECT_BROADCAST}
    networks:
      - atomic-network
    depends_on:
      - ws
      - redis

volumes:
  deez-nutz-data:

networks:
  atomic-network:
    driver: bridge