name: Continuous Integration

on: [push, pull_request]

jobs:
  quality-gate:
    name: PHP 8.4 Quality & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: swoole, pcntl, posix
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-progress --no-suggest

      # Check PSR-12 and custom strict rules
      - name: PHP Linting (Coding Standards)
        run: composer lint-dry

      - name: Static Analysis (PHPStan)
        run: composer analyze

      - name: Run Unit Tests (PHPUnit)
        run: composer test
        continue-on-error: false

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.1
          working-directory: go
          args: --timeout=5m
          skip-cache: true

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - name: Cache gotestsum
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-gotestsum
      - name: Install gotestsum
        run: |
          if [ ! -f ~/go/bin/gotestsum ]; then
            go install gotest.tools/gotestsum@latest
          fi
      - name: Run Go Tests
        run: cd go && ~/go/bin/gotestsum --format testname -- -count=1 -failfast ./...
